<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Engagement Chronology</title>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: var(--cp-bg);
      color: var(--cp-text);
      font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    button {
      font: inherit;
    }

    .page-shell {
      width: min(1040px, calc(100% - 40px));
      margin: 0 auto;
      padding: 72px 0 80px;
    }

    .masthead {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 40px;
      align-items: end;
      padding-bottom: 32px;
      border-bottom: 1px solid var(--cp-border-strong);
      animation: reveal 500ms ease-out both;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--cp-accent);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1 {
      max-width: 700px;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.6rem, 7vw, 5.5rem);
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: 0;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(88px, 1fr));
      gap: 8px;
      min-width: 220px;
    }

    .metric {
      padding: 14px 16px;
      border-left: 2px solid var(--cp-accent);
      background: var(--cp-bg-elevated);
    }

    .metric strong,
    .metric span {
      display: block;
    }

    .metric strong {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.6rem;
      font-weight: 400;
    }

    .metric span {
      margin-top: 4px;
      color: var(--cp-text-muted);
      font-size: 0.75rem;
      text-transform: uppercase;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin: 28px 0 44px;
      animation: reveal 500ms 100ms ease-out both;
    }

    .toolbar-label {
      margin-right: 8px;
      color: var(--cp-text-muted);
      font-size: 0.84rem;
      font-weight: 600;
    }

    .filter-button {
      min-height: 36px;
      padding: 7px 14px;
      border: 1px solid var(--cp-border);
      border-radius: 0.625rem;
      background: var(--cp-surface);
      color: var(--cp-text);
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, color 160ms ease;
    }

    .filter-button:hover {
      border-color: var(--cp-accent);
      background: var(--cp-accent-soft);
    }

    .filter-button[aria-pressed="true"] {
      border-color: var(--cp-accent);
      background: var(--cp-accent);
      color: var(--cp-accent-fg);
    }

    .timeline {
      position: relative;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .timeline::before {
      position: absolute;
      top: 16px;
      bottom: 16px;
      left: 169px;
      width: 1px;
      background: var(--cp-border-strong);
      content: "";
    }

    .event {
      display: grid;
      grid-template-columns: 140px 58px minmax(0, 1fr);
      min-height: 142px;
      animation: reveal 480ms ease-out both;
    }

    .event[hidden] {
      display: none;
    }

    .date {
      padding-top: 18px;
      color: var(--cp-text-muted);
      text-align: right;
    }

    .date-day {
      display: block;
      color: var(--cp-text);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 2rem;
      line-height: 1;
    }

    .date-month {
      display: block;
      margin-top: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .marker-wrap {
      position: relative;
      display: flex;
      justify-content: center;
      padding-top: 23px;
    }

    .marker {
      z-index: 1;
      width: 17px;
      height: 17px;
      border: 4px solid var(--cp-bg);
      border-radius: 50%;
      background: var(--cp-accent);
      outline: 1px solid var(--cp-accent);
    }

    .event-card {
      position: relative;
      margin: 0 0 24px;
      padding: 18px 20px 20px;
      border: 1px solid var(--cp-border);
      border-radius: 16px;
      background: var(--cp-surface);
      box-shadow: 0 0 2px var(--cp-border), 0 1px 2px var(--cp-border);
      transition: border-color 160ms ease, transform 160ms ease;
    }

    .event-card:hover {
      border-color: var(--cp-accent);
      transform: translateY(-2px);
    }

    .event-index {
      position: absolute;
      top: 17px;
      right: 18px;
      color: var(--cp-text-soft);
      font-family: Consolas, "Courier New", Courier, monospace;
      font-size: 0.72rem;
    }

    .event-type {
      display: inline-block;
      margin: 0 0 10px;
      color: var(--cp-accent);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .event-title {
      margin: 0;
      padding-right: 44px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.75rem;
      font-weight: 400;
      line-height: 1.15;
    }

    .event-time {
      margin: 10px 0 0;
      color: var(--cp-text-muted);
      font-size: 0.86rem;
    }

    .empty-state {
      margin-left: 198px;
      padding: 32px;
      border: 1px dashed var(--cp-border-strong);
      border-radius: 16px;
      color: var(--cp-text-muted);
      text-align: center;
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 680px) {
      .page-shell {
        width: min(100% - 24px, 1040px);
        padding: 36px 0 48px;
      }

      .masthead {
        grid-template-columns: 1fr;
        gap: 28px;
      }

      .summary {
        width: 100%;
      }

      .toolbar {
        margin-bottom: 32px;
      }

      .toolbar-label {
        width: 100%;
      }

      .timeline::before {
        left: 10px;
      }

      .event {
        grid-template-columns: 24px minmax(0, 1fr);
        min-height: 0;
      }

      .date {
        grid-column: 2;
        padding: 0 0 10px 14px;
        text-align: left;
      }

      .date-day,
      .date-month {
        display: inline;
        font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 0.78rem;
      }

      .date-day {
        font-weight: 700;
      }

      .marker-wrap {
        grid-column: 1;
        grid-row: 1 / span 2;
        justify-content: flex-start;
        padding-top: 4px;
      }

      .marker {
        width: 13px;
        height: 13px;
        border-width: 3px;
      }

      .event-card {
        grid-column: 2;
        margin: 0 0 24px 14px;
      }

      .empty-state {
        margin-left: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <header class="masthead">
      <div>
        <p class="eyebrow">Engagement record</p>
        <h1>Chronology</h1>
      </div>
      <div class="summary" aria-label="Timeline summary">
        <div class="metric">
          <strong id="event-count">0</strong>
          <span>Engagements</span>
        </div>
        <div class="metric">
          <strong id="span-count">0d</strong>
          <span>Time span</span>
        </div>
      </div>
    </header>

    <nav class="toolbar" aria-label="Filter engagements by type">
      <span class="toolbar-label">Show</span>
      <div id="filters"></div>
    </nav>

    <ol class="timeline" id="timeline" aria-live="polite"></ol>
    <p class="empty-state" id="empty-state" hidden>No engagements match this filter.</p>
  </main>

  <script>
    const activities = [
      { activity: "Seed", timestamp: "2026-07-08T10:00:00Z", type: "initiation" },
      { activity: "Sprouting", timestamp: "2026-07-14T10:00:00Z", type: "differentiation" },
      { activity: "Flowering", timestamp: "2026-07-21T10:00:00Z", type: "maturation" }
    ];

    const sortedActivities = [...activities].sort(
      (first, second) => new Date(first.timestamp) - new Date(second.timestamp)
    );
    const timeline = document.querySelector("#timeline");
    const filters = document.querySelector("#filters");
    const emptyState = document.querySelector("#empty-state");
    const dateParts = new Intl.DateTimeFormat(undefined, {
      day: "2-digit",
      month: "short",
      year: "numeric",
      timeZone: "UTC"
    });
    const timeFormat = new Intl.DateTimeFormat(undefined, {
      hour: "numeric",
      minute: "2-digit",
      timeZone: "UTC",
      timeZoneName: "short"
    });

    function renderTimeline(selectedType = "all") {
      timeline.replaceChildren();
      const visibleActivities = sortedActivities.filter(
        (item) => selectedType === "all" || item.type === selectedType
      );

      visibleActivities.forEach((item, index) => {
        const date = new Date(item.timestamp);
        const parts = Object.fromEntries(
          dateParts.formatToParts(date).filter((part) => part.type !== "literal").map((part) => [part.type, part.value])
        );
        const event = document.createElement("li");
        event.className = "event";
        event.style.animationDelay = `${index * 80}ms`;

        const dateElement = document.createElement("time");
        dateElement.className = "date";
        dateElement.dateTime = item.timestamp;
        dateElement.innerHTML = `<span class="date-day">${parts.day}</span><span class="date-month">${parts.month} ${parts.year}</span>`;

        const markerWrap = document.createElement("div");
        markerWrap.className = "marker-wrap";
        markerWrap.setAttribute("aria-hidden", "true");
        const marker = document.createElement("span");
        marker.className = "marker";
        markerWrap.append(marker);

        const card = document.createElement("article");
        card.className = "event-card";
        const type = document.createElement("p");
        type.className = "event-type";
        type.textContent = item.type;
        const title = document.createElement("h2");
        title.className = "event-title";
        title.textContent = item.activity;
        const time = document.createElement("p");
        time.className = "event-time";
        time.textContent = timeFormat.format(date);
        const eventIndex = document.createElement("span");
        eventIndex.className = "event-index";
        eventIndex.textContent = String(sortedActivities.indexOf(item) + 1).padStart(2, "0");
        eventIndex.setAttribute("aria-hidden", "true");
        card.append(type, title, time, eventIndex);

        event.append(dateElement, markerWrap, card);
        timeline.append(event);
      });

      emptyState.hidden = visibleActivities.length > 0;
    }

    function renderFilters() {
      const types = ["all", ...new Set(sortedActivities.map((item) => item.type))];
      types.forEach((type) => {
        const button = document.createElement("button");
        button.className = "filter-button";
        button.type = "button";
        button.textContent = type === "all" ? "All" : type;
        button.dataset.type = type;
        button.setAttribute("aria-pressed", String(type === "all"));
        button.addEventListener("click", () => {
          filters.querySelectorAll("button").forEach((candidate) => {
            candidate.setAttribute("aria-pressed", String(candidate === button));
          });
          renderTimeline(type);
        });
        filters.append(button);
      });
    }

    function renderSummary() {
      document.querySelector("#event-count").textContent = sortedActivities.length;
      if (sortedActivities.length < 2) {
        document.querySelector("#span-count").textContent = "0d";
        return;
      }
      const first = new Date(sortedActivities[0].timestamp);
      const last = new Date(sortedActivities.at(-1).timestamp);
      const days = Math.round((last - first) / 86400000);
      document.querySelector("#span-count").textContent = `${days}d`;
    }

    renderFilters();
    renderSummary();
    renderTimeline();
  </script>
</body>
</html>
